<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Face Swap em tempo real via webcam — MVP">
    <title>Face Swap MVP</title>
    <style>
        /* ========================================
           FASE 1: Placeholder visual mínimo
           Será substituído por UI completa na FASE 6
           ======================================== */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            text-align: center;
            padding: 3rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            max-width: 500px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(90deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1.25rem;
            border-radius: 999px;
            font-size: 0.9rem;
            font-weight: 500;
            margin-top: 1.5rem;
        }

        .status--loading {
            background: rgba(251, 191, 36, 0.15);
            color: #fbbf24;
            border: 1px solid rgba(251, 191, 36, 0.3);
        }

        .status--ok {
            background: rgba(52, 211, 153, 0.15);
            color: #34d399;
            border: 1px solid rgba(52, 211, 153, 0.3);
        }

        .status--error {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        .status--loading .dot { background: #fbbf24; }
        .status--ok .dot      { background: #34d399; animation: none; }
        .status--error .dot   { background: #ef4444; animation: none; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50%      { opacity: 0.3; }
        }

        p {
            color: #9ca3af;
            line-height: 1.6;
            margin-top: 0.75rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎭 Face Swap MVP</h1>
        <p>Ambiente Docker funcionando.<br>Frontend servido via Nginx.</p>
        <div id="status" class="status status--loading">
            <span class="dot"></span>
            <span id="status-text">Verificando backend…</span>
        </div>
    </div>

    <script>
        // Faz um GET no healthcheck do backend (via proxy Nginx /api/)
        // para confirmar que todos os serviços estão rodando.
        (async function checkBackend() {
            const statusEl  = document.getElementById('status');
            const textEl    = document.getElementById('status-text');

            try {
                const res  = await fetch('/api/health');
                const data = await res.json();

                if (data.status === 'ok') {
                    statusEl.className = 'status status--ok';
                    textEl.textContent = 'Backend online ✓';
                } else {
                    throw new Error('Resposta inesperada');
                }
            } catch (err) {
                statusEl.className = 'status status--error';
                textEl.textContent = 'Backend offline ✗';
                console.error('Healthcheck falhou:', err);
            }
        })();
    </script>
</body>
</html>
