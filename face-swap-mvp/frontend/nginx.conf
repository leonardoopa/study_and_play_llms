# ==========================================================
# Nginx — Serve o frontend estático e faz proxy para o backend
# ==========================================================

server {
    listen 80;
    server_name localhost;

    # --- Frontend: arquivos estáticos ---
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Proxy reverso para API e WebSocket do backend ---
    location /api/ {
        proxy_pass http://backend:8000; # Sem barra no final para manter o /api no path
        
        # Headers padrão
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Suporte a WebSocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts longos para manter o WS aberto
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
