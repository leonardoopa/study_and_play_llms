# ==============================================================
# Docker Compose — Face Swap MVP
#
# Serviços:
#   db       → PostgreSQL 16 Alpine
#   backend  → FastAPI + Uvicorn (build local)
#   frontend → Nginx servindo arquivos estáticos
#
# Uso:
#   docker compose up --build        (primeira vez)
#   docker compose up                (execuções seguintes)
#   docker compose down -v           (remove tudo, incluindo volumes)
# ==============================================================

services:
  # -------------------------------------------------------
  # PostgreSQL
  # -------------------------------------------------------
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # -------------------------------------------------------
  # Backend — FastAPI
  # -------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app          # Hot-reload em dev
      - ./uploads:/app/uploads  # Imagens de rosto enviadas
      - ./models:/app/models    # Modelos ONNX
    # --- GPU NVIDIA (descomentar se tiver nvidia-docker) ---
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # -------------------------------------------------------
  # Frontend — Nginx
  # -------------------------------------------------------
  frontend:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro

# -------------------------------------------------------
# Volumes nomeados
# -------------------------------------------------------
volumes:
  pgdata:
    driver: local
